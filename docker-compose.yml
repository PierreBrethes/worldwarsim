services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    restart: unless-stopped
    # SQLite derrière : le backend s'arrête proprement sur SIGINT, pas sur le SIGTERM par défaut.
    stop_signal: SIGINT
    stop_grace_period: 10s
    # Le dev n'ouvre rien au Wi-Fi : la prod remet `ports` à zéro de toute façon.
    ports:
      - '127.0.0.1:3210:3210'
      - '127.0.0.1:3211:3211'
    volumes:
      - convex-data:/convex/data
    environment:
      - INSTANCE_NAME=${INSTANCE_NAME:-worldwarsim}
      - INSTANCE_SECRET=${INSTANCE_SECRET:?definir INSTANCE_SECRET dans .env — voir deploiement/README.md}
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
      - DISABLE_BEACON=true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    restart: unless-stopped
    stop_signal: SIGINT
    ports:
      - '127.0.0.1:6791:6791'
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    depends_on:
      backend:
        condition: service_healthy

  front:
    profiles: ['prod']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3
    build:
      context: .
      dockerfile: deploiement/front.Dockerfile
      args:
        VITE_CONVEX_URL: ${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
        VITE_PUBLIC_ORIGIN: ${VITE_PUBLIC_ORIGIN:-https://wws.pierrebrethes.cloud}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  convex-data:
