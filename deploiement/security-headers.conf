# Les en-têtes de sécurité du front, inclus dans **chaque** `location` de `nginx.conf` : un
# `add_header` posé dans une `location` efface ceux hérités du `server`, donc les poser une seule
# fois là-haut les ferait disparaître partout où un `Cache-Control` est déjà écrit.
#
# `always` : ils valent aussi pour un 404, qui est du HTML comme le reste.

# Un fichier n'est jamais réinterprété d'après son contenu : un JSON reste un JSON.
add_header X-Content-Type-Options "nosniff" always;

# Le code d'invitation est dans l'adresse (`/rejoindre/CODE`) et c'est le seul secret du salon :
# il ne part vers aucun autre site, pas même vers celui des polices.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Le jeu ne se joue dans le cadre de personne : pas de clic détourné sur « envoyer — irréversible ».
# `X-Frame-Options` pour les navigateurs qui ne lisent pas `frame-ancestors`.
add_header X-Frame-Options "DENY" always;

# Les quatre directives qu'on peut **imposer** sans connaître la page : aucune ne touche à ce que
# le jeu charge. Pas de `<base>` détourné, pas de greffon, pas de formulaire posté ailleurs.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

# **La politique complète, en observation seulement.** Le jeton de session vit dans
# `localStorage` : `script-src 'self'` est ce qui empêcherait un script injecté de le lire. Elle
# n'est pas imposée parce qu'elle n'a pas été vue tourner sur une partie réelle — en
# `Report-Only` le navigateur ne bloque rien et écrit chaque écart dans sa console. Une partie
# jouée sans une ligne « Content-Security-Policy-Report-Only » dans la console, et ces directives
# montent dans l'en-tête du dessus.
#
# `connect-src https: wss:` plutôt que l'origine Convex : elle est un argument de build
# (`VITE_CONVEX_URL`), et ce fichier ne le connaît pas.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https: wss:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

# Le front n'est servi qu'en HTTPS (Traefik, entrypoint `websecure`). Six mois, sans
# `includeSubDomains` : les autres sous-domaines du VPS ne sont pas l'affaire de ce fichier.
add_header Strict-Transport-Security "max-age=15552000" always;

# Rien de ce que le jeu n'utilise pas ne s'ouvre, pour lui ni pour un script tiers.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
