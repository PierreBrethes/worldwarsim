server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # `gzip_types` nomme les deux types qu'un `mime.types` peut donner à un `.js` : l'image n'est
  # pas épinglée, et le jour où elle passerait à `text/javascript` le chunk du plateau (890 Ko)
  # partirait en clair sans qu'aucun test le dise. `gzip_proxied any` pour la même raison côté
  # proxy : derrière Traefik, une requête qui porterait un `Via` ne serait plus compressée.
  # Niveau 5 : le niveau 1 par défaut laisse ~15 % sur des JSON de plusieurs mégaoctets.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css text/javascript application/javascript application/json
    application/manifest+json image/svg+xml model/gltf-binary;

  # La version de nginx n'est l'affaire de personne.
  server_tokens off;

  # Les fichiers d'assets portent un hachage dans leur nom : leur contenu ne change jamais,
  # donc ils se cachent un an. `=404` est indispensable : sans lui, le `try_files` du serveur
  # est hérité ici et un chunk absent — celui d'un déploiement précédent — repartirait en
  # `index.html` avec un code 200, soit du HTML servi comme du JavaScript.
  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Les figurines et maquettes (`.glb`, 34 Mo bruts) : l'image nginx:alpine ne connaît pas
  # l'extension et les servait en `application/octet-stream`, hors `gzip_types`, donc en clair —
  # leur géométrie se compresse pourtant de moitié. Une regex l'emporte sur le préfixe
  # `/assets/`, d'où les mêmes en-têtes et le même `=404` ; le `types { }` vide ne vaut que pour
  # ces fichiers, comme pour le manifeste plus bas.
  location ~ ^/assets/.+\.glb$ {
    types { }
    default_type model/gltf-binary;
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Les films, montés depuis un dossier du VPS (plan-4b-2026-10-02). `=404` pour la même raison
  # que `/assets/` : sans lui, une vidéo absente repartirait en `index.html` avec un 200. Un jour
  # et pas `immutable` : les noms ne sont pas hachés, un nouveau rendu du film garde le sien.
  # Nginx sert les plages d'octets seul ; les mp4 n'entrent pas dans `gzip_types`.
  location /media/ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
  }

  # **`index.html` ne se cache pas**, et c'est la moitié serveur du problème des chunks
  # fantômes : c'est lui qui nomme les hachages du build courant. Mis en cache par heuristique
  # — nginx ne pose ici ni `Cache-Control` ni `Expires` par défaut — un navigateur rejoue
  # l'index de la veille et demande des fichiers que le déploiement a effacés. `no-cache`
  # n'interdit pas le cache, il impose la revalidation : un 304 quand rien n'a bougé.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # L'image nginx:alpine sert le manifeste en `application/octet-stream` : son `mime.types`
  # ne connaît pas l'extension `.webmanifest`, et les navigateurs peuvent alors l'ignorer.
  # Le `types { }` vide ne vaut que pour ce fichier — placé dans le `server`, il viderait la
  # table des types de tout le site — et `default_type` donne le bon. `no-cache` impose la
  # revalidation (un 304 quand rien n'a bougé) : un changement d'icône ou de nom arrive sans
  # attendre l'expiration d'un cache heuristique. `=404` pour la même raison que `/assets/`.
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Un service worker figé en cache empêche toute correction : le navigateur le revérifie de
  # lui-même, mais pas à travers un cache HTTP qui lui répondrait « inchangé ». Il ne fait que
  # les notifications (`public/sw.js`). `=404` pour la même raison que `/assets/`.
  location = /sw.js {
    default_type application/javascript;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Les données de carte (`world.json`, `regions.json`…) ne portent pas de hachage et vont avec
  # le code qui les lit : sans `Cache-Control`, le navigateur les garde par heuristique et peut
  # servir la carte d'avant à un build qui en attend une autre. `no-cache` impose la
  # revalidation — un 304 quand rien n'a bougé, jamais 1 Mo retéléchargé pour rien.
  location ~ ^/[^/]+\.json$ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
