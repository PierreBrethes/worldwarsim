# Override de production — VPS derrière Traefik.
#
#   docker compose -f docker-compose.yml -f deploiement/compose.prod.yml --profile prod up -d
#
# Principe : en prod, AUCUN service ne publie de port sur l'hôte (Docker contourne ufw — un
# port publié est un port mondial). Le dashboard, lui, passe par Traefik sur son propre
# sous-domaine, derrière un BasicAuth (voir plus bas).
#
# Le Traefik du VPS (relevé le 23/08) tourne en `network_mode: host` : il n'appartient à
# aucun réseau Docker, il n'y a donc PAS de réseau partagé à déclarer. Depuis l'hôte, il
# atteint directement les IP des conteneurs sur le réseau par défaut du compose
# (`worldwarsim_default`) — le label `traefik.docker.network` le lui désigne. Entrypoint
# `websecure` et certresolver `letsencrypt` : confirmés sur ce Traefik.
#
# `!reset` exige Docker Compose >= 2.24 (`docker compose version` pour vérifier).

services:
  backend:
    ports: !reset []
    labels:
      - traefik.enable=true
      - traefik.docker.network=worldwarsim_default

      # L'API Convex (3210) — CONVEX_CLOUD_ORIGIN. Traefik passe les upgrades WebSocket
      # sans rien demander : c'est le point que le README exigeait du proxy.
      - traefik.http.routers.wws-convex.rule=Host(`convex.pierrebrethes.cloud`)
      - traefik.http.routers.wws-convex.entrypoints=websecure
      - traefik.http.routers.wws-convex.tls.certresolver=letsencrypt
      - traefik.http.routers.wws-convex.service=wws-convex
      - traefik.http.services.wws-convex.loadbalancer.server.port=3210

      # Les actions HTTP Convex (3211) — CONVEX_SITE_ORIGIN. Le README d'avant ne routait
      # que 3210 : sans ce routeur, tout ce qui passe par le site origin est mort en prod.
      - traefik.http.routers.wws-actions.rule=Host(`convex-actions.pierrebrethes.cloud`)
      - traefik.http.routers.wws-actions.entrypoints=websecure
      - traefik.http.routers.wws-actions.tls.certresolver=letsencrypt
      - traefik.http.routers.wws-actions.service=wws-actions
      - traefik.http.services.wws-actions.loadbalancer.server.port=3211

  # Le dashboard est une console d'admin, joignable depuis le web sur son propre sous-domaine
  # derrière deux barrières : le BasicAuth de Traefik, puis la clé d'admin Convex demandée à la
  # connexion. Aucun port publié — 6791 sur l'hôte appartient déjà au dashboard de l'autre
  # instance Convex du VPS, et un port publié contourne ufw (voir l'en-tête de ce fichier).
  #
  # Le couple identifiant/hash vit dans `.env` et pas ici : le dépôt est lu par tous ceux qui
  # ont le code, pas seulement par ceux qui ont l'accès. `:?` pour que l'absence fasse échouer
  # le `up` — un `basicauth.users` vide, Traefik le lit comme « tout le monde passe ».
  # Régénérer : `htpasswd -nbB <utilisateur> <mot de passe>`.
  dashboard:
    ports: !reset []
    labels:
      - traefik.enable=true
      - traefik.docker.network=worldwarsim_default
      - traefik.http.routers.wws-dashboard.rule=Host(`convex-dashboard.pierrebrethes.cloud`)
      - traefik.http.routers.wws-dashboard.entrypoints=websecure
      - traefik.http.routers.wws-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.wws-dashboard.service=wws-dashboard
      - traefik.http.routers.wws-dashboard.middlewares=wws-dashboard-auth
      - traefik.http.services.wws-dashboard.loadbalancer.server.port=6791
      - traefik.http.middlewares.wws-dashboard-auth.basicauth.users=${WWS_DASHBOARD_AUTH:?definir WWS_DASHBOARD_AUTH dans .env — voir deploiement/README.md}

  front:
    ports: !reset []
    # Les films vivent hors du dépôt (plan-4b-2026-10-02), dans un dossier créé à la main sur le
    # VPS. Il doit exister avant le premier `up` : sinon Docker le crée vide, au nom de root.
    volumes:
      - ${WWS_MEDIA_DIR:-/opt/worldwarsim-media}:/usr/share/nginx/html/media:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=worldwarsim_default
      - traefik.http.routers.wws-front.rule=Host(`wws.pierrebrethes.cloud`)
      - traefik.http.routers.wws-front.entrypoints=websecure
      - traefik.http.routers.wws-front.tls.certresolver=letsencrypt
      - traefik.http.services.wws-front.loadbalancer.server.port=80
