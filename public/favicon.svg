<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="WorldWarSim">
  <!--
    Le pavé de la manchette, seul et droit : à seize pixels, l'inclinaison de deux degrés du logo
    ne se lit plus et ne fait que baver sur les bords. Coins droits, comme un bloc de plomb.

    Les deux W sont **tracés**, pas écrits : un favicon est rendu hors de la page, sans la feuille
    de style ni les fontes qu'elle charge — un `<text>` retomberait sur la police système et le
    logo changerait de dessin d'un système à l'autre. Les couleurs sont écrites en dur pour la
    même raison : aucune variable CSS ne l'atteint (`--critical`, `--paper`).
  -->
  <rect width="32" height="32" fill="#9d4638" />
  <g fill="none" stroke="#e4d8bd" stroke-width="3" stroke-linejoin="miter" stroke-linecap="butt">
    <path d="M3 9 L6 23 L9 14.5 L12 23 L15 9" />
    <path d="M17 9 L20 23 L23 14.5 L26 23 L29 9" />
  </g>
</svg>
