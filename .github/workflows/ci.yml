name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Une seule liste de vérifications, partagée avec le hook pre-push (.githooks/pre-push) :
      # types, lint, format, tests, build, miroir de simulation. Elles ne peuvent pas diverger.
      - name: Vérifications
        run: npm run verifier
