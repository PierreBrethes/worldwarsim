name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Types
        run: npm run types

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Miroir de simulation
        run: node WWS/simulation/opening/verify.mjs
