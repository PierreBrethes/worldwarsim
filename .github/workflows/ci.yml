name: CI

# `main` déploie la pré-production, `version-test` la version de test (deploiement/README.md
# « Version de test »). Aucune autre branche ne déclenche ce workflow.
on:
  push:
    branches: [main, version-test]
  workflow_dispatch:

# Le jeton du workflow ne lit que le dépôt : rien ici n'a besoin d'écrire dessus, et une action
# tierce compromise ne doit pas pouvoir le faire. Les actions sont épinglées par SHA (le tag
# peut être déplacé), le commentaire dit la version lue.
permissions:
  contents: read

# Un déploiement à la fois par instance, jamais annulé en vol : un convex deploy interrompu à
# moitié vaudrait pire qu'un déploiement en retard.
concurrency:
  group: deploiement-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verifications:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Ce qui part en production, et rien d'autre : l'outillage de développement a ses propres
      # avis, qui ne doivent pas bloquer un déploiement.
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high

      # Une seule liste de vérifications, partagée avec le hook pre-push (.githooks/pre-push) :
      # types, lint, format, tests, build, miroir de simulation. Elles ne peuvent pas diverger.
      - name: Vérifications
        run: npm run verifier

  # Le parcours critique en navigateur, contre un backend local (#651) : voir e2e.yml.
  e2e:
    uses: ./.github/workflows/e2e.yml

  # Le déploiement est en aval des vérifications et du parcours — même workflow, même liste, aucune
  # divergence possible. Les pas vivent dans deployer.yml, partagés par les deux instances.
  deployer:
    if: github.ref_name == 'main'
    needs: [verifications, e2e]
    uses: ./.github/workflows/deployer.yml
    with:
      branche: main
      front: https://wws.pierrebrethes.cloud/
    secrets:
      convex_url: ${{ secrets.CONVEX_SELF_HOSTED_URL }}
      convex_cle: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
      vps_chemin: ${{ secrets.VPS_CHEMIN }}
      vps_hote: ${{ secrets.VPS_HOTE }}
      vps_utilisateur: ${{ secrets.VPS_UTILISATEUR }}
      vps_cle_ssh: ${{ secrets.VPS_CLE_SSH }}

  # La version de test : ses propres secrets `TEST_*`, le même VPS et la même clé SSH. Un
  # correctif n'y part qu'après une copie de la base.
  deployer-test:
    if: github.ref_name == 'version-test'
    needs: [verifications, e2e]
    uses: ./.github/workflows/deployer.yml
    with:
      branche: version-test
      front: ${{ vars.TEST_FRONT_URL }}
      sauvegarder_avant: true
    secrets:
      convex_url: ${{ secrets.TEST_CONVEX_SELF_HOSTED_URL }}
      convex_cle: ${{ secrets.TEST_CONVEX_SELF_HOSTED_ADMIN_KEY }}
      vps_chemin: ${{ secrets.TEST_VPS_CHEMIN }}
      vps_hote: ${{ secrets.VPS_HOTE }}
      vps_utilisateur: ${{ secrets.VPS_UTILISATEUR }}
      vps_cle_ssh: ${{ secrets.VPS_CLE_SSH }}
