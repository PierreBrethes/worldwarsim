<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="La Manchette">
  <!--
    L'icône de La Manchette, piste B « la feuille » (décision marque-icone-2026-10-03) : le M de
    la manchette à l'encre sur le papier, et le filet rouge dessous. Le M est le contour du glyphe
    de Bodoni Moda (wght 800, opsz 6) cuit en chemin ; couleurs en dur (#e4d8bd papier, #2a2118
    encre, #9d4638 critique) : aucune variable CSS n'atteint une icône.
  -->
  <rect width="512" height="512" fill="#e4d8bd"/>
  <defs><pattern id="t" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.6" height="10" fill="#2a2118" fill-opacity=".07"/></pattern></defs>
  <rect width="512" height="512" fill="url(#t)"/>
  <g transform="translate(256.0 256.0) scale(0.8) translate(-256.0 -256.0)">
