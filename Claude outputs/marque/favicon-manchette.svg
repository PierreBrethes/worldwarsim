<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="La Manchette" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Le M de la manchette, en didone sur le pavé rouge. Le contour est celui du glyphe « M » de
    Bodoni Moda (wght 800, opsz 6), extrait par fontTools et cuit en chemin : un favicon est
    rendu hors de la page, sans la feuille de style ni les fontes qu'elle charge — un `<text>`
